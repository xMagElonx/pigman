<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="'Segoe UI','Microsoft YaHei',Consolas,sans-serif">
  <rect width="680" height="540" fill="#121316"/>
  <rect width="680" height="40" fill="#1b1d22"/>
  <text x="18" y="26" fill="#e8eaed" font-size="15" font-weight="bold">屠刀 · 柄部验收卡（无护手版）</text>
  <text x="500" y="26" fill="#7d828a" font-size="11">一屏 · 逐条打勾</text>

  <!-- ① -->
  <text x="18" y="62" fill="#8fb4ff" font-size="13" font-weight="bold">① 打开游戏</text>
  <text x="18" y="82" fill="#c9ccd1" font-size="12.5">按 F5 → 点一下画面锁定鼠标 → 按 Tab 开面板</text>

  <!-- ② -->
  <text x="18" y="110" fill="#8fb4ff" font-size="13" font-weight="bold">② 滚到面板最下面，找到这 5 根新滑条</text>
  <g font-size="12" fill="#d7dae0" font-family="Consolas,monospace">
    <text x="26" y="132">│ 柄长 m           0.200</text>
    <text x="26" y="150">│ 柄径 m           0.040</text>
    <text x="26" y="168">│ 握持点前后 m      0.000</text>
    <text x="26" y="186">│ 露柄舌长 m        0.010</text>
    <text x="26" y="204">│ 柄尾加粗 m        0.000</text>
  </g>

  <!-- ③ -->
  <text x="18" y="230" fill="#8fb4ff" font-size="13" font-weight="bold">③ 对着右图，逐条看（每行打一个勾）</text>
  <g font-size="12.5" fill="#d7dae0">
    <rect x="18" y="240" width="13" height="13" fill="none" stroke="#6b7078"/>
    <text x="38" y="251"><tspan fill="#ff8a8a" font-weight="bold">H1 无护手</tspan> — 刀根与柄之间没有任何横向张开的挡片</text>

    <rect x="18" y="260" width="13" height="13" fill="none" stroke="#6b7078"/>
    <text x="38" y="271"><tspan fill="#ff8a8a" font-weight="bold">H2 柄是圆的</tspan> — 从刀尖方向看是圆棒，不是方块</text>

    <rect x="18" y="280" width="13" height="13" fill="none" stroke="#6b7078"/>
    <text x="38" y="291"><tspan fill="#ff8a8a" font-weight="bold">H3 柄舌</tspan> — 刀根与木柄之间露出一小截更细的金属腰</text>

    <rect x="18" y="300" width="13" height="13" fill="none" stroke="#6b7078"/>
    <text x="38" y="311"><tspan fill="#ff8a8a" font-weight="bold">H4 同一轴线</tspan> — 柄不竖着穿过刀身</text>

    <rect x="18" y="320" width="13" height="13" fill="none" stroke="#6b7078"/>
    <text x="38" y="331"><tspan fill="#ff8a8a" font-weight="bold">H5 木不发黑</tspan> — 哑光暖褐，不是黑亮的金属块</text>
  </g>

  <!-- ④ -->
  <text x="18" y="358" fill="#8fb4ff" font-size="13" font-weight="bold">④ 拖一下（改完 0.6 秒自动存盘）</text>
  <g font-size="12.5" fill="#d7dae0">
    <text x="18" y="378">· 柄长 0.14 ↔ 0.28 → 木柄实时伸缩，<tspan fill="#ffd166">刀不跟着动</tspan></text>
    <text x="18" y="396">· 柄径 → 柄实时变粗变细</text>
    <text x="18" y="414">· 握持点前后 → <tspan fill="#ffd166">整把刀前后走</tspan>（− 贴刀握 / + 靠尾握）</text>
    <text x="18" y="432">· 露柄舌长 → 刀根前那截金属腰伸缩</text>
    <text x="18" y="450">· 柄尾加粗 → 柄尾多出一小段更深的木</text>
  </g>

  <!-- 防误判 -->
  <rect x="14" y="462" width="352" height="64" rx="6" fill="#241d10" stroke="#7a5a12"/>
  <text x="24" y="482" fill="#ffd166" font-size="12" font-weight="bold">⚠️ 两条别误判</text>
  <text x="24" y="500" fill="#e6d6a8" font-size="11">拖「握持点前后」时，刀尖距眼和砍到的距离一起变 = 正常</text>
  <text x="24" y="516" fill="#e6d6a8" font-size="11">面板现在 34 行超出一屏 → 滚轮往下翻，柄那组在最下面</text>

  <!-- 右列 ground-truth -->
  <rect x="382" y="52" width="286" height="198" rx="8" fill="#0d0e11" stroke="#2a2d33"/>
  <text x="394" y="70" fill="#7d828a" font-size="10.5">刀身 + 柄（侧视 · 示意）</text>

  <!-- 轴线 -->
  <line x1="388" y1="160" x2="664" y2="160" stroke="#6b7078" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="388" y="240" fill="#6b7078" font-size="9.5">H4 全在同一轴线上</text>

  <!-- 木柄 -->
  <rect x="392" y="150" width="68" height="22" rx="5" fill="#4a3627"/>
  <!-- 柄尾加粗（可选，虚线示意） -->
  <rect x="392" y="147" width="15" height="28" rx="5" fill="none" stroke="#8a6a48" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- 柄舌 -->
  <rect x="456" y="156" width="14" height="10" rx="2" fill="#5a5a5a"/>

  <!-- 刀身 -->
  <polygon points="469,142 510,132 570,134 615,144 662,160 620,184 562,198 512,198 469,180" fill="#4c4a47"/>
  <polyline points="469,142 510,132 570,134 615,144 662,160" fill="none" stroke="#1a1512" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="662,160 620,184 562,198 512,198 469,180" fill="none" stroke="#c2c4c7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 说明 -->
  <g font-size="11.5" fill="#c9ccd1">
    <circle cx="390" cy="272" r="3.5" fill="#8fb4ff"/>
    <text x="402" y="276">柄 = 圆木棒，暖褐哑光（不是黑方块）</text>
    <circle cx="390" cy="296" r="3.5" fill="#8fb4ff"/>
    <text x="402" y="300">刀根前露出一小截更细的金属「柄舌」</text>
    <circle cx="390" cy="320" r="3.5" fill="#ff8a8a"/>
    <text x="402" y="324">无护手 —— 这里没有任何横向张开的挡片</text>
  </g>

  <text x="18" y="538" fill="#5f646c" font-size="11">对不上？把这一屏截图发我即可 —— 一张图胜过一段描述。</text>
</svg>
